<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLVD | Studio Native</title>
    <style>
        :root {
            --bg: #050505;
            --accent: #0070f3;
            --surface: #0a0a0a;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container do Player */
        .stage {
            width: 100%;
            max-width: 960px;
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 16px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Lista de Canais Profissional */
        .channel-list {
            margin-top: 25px;
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .channel-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .channel-card:hover {
            border-color: var(--accent);
            background: rgba(0, 112, 243, 0.05);
        }

        .channel-card.active {
            border-color: var(--accent);
            background: rgba(0, 112, 243, 0.1);
            font-weight: bold;
        }

        .channel-card h4 { margin: 0; font-size: 0.85rem; letter-spacing: 0.5px; }

        header { padding: 30px 0; text-align: center; }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: -1px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">TLVD <span style="color: var(--accent);">TV</span></div>
    </header>

    <main class="stage">
        <div class="video-container">
            <iframe id="tv-player" src="https://www.tdtchannels.com/embed/player.php?id=nick_pluto_br" allowfullscreen allow="autoplay; fullscreen"></iframe>
        </div>
    </main>

    <div class="channel-list">
        <div class="channel-card active" onclick="change('nick_pluto_br', this)">
            <h4>Nick Pluto TV</h4>
        </div>
        <div class="channel-card" onclick="change('record_news', this)">
            <h4>Record News</h4>
        </div>
        <div class="channel-card" onclick="change('band', this)">
            <h4>Band</h4>
        </div>
        <div class="channel-card" onclick="change('sbt', this)">
            <h4>SBT</h4>
        </div>
        <div class="channel-card" onclick="change('cnn_br', this)">
            <h4>CNN Brasil</h4>
        </div>
        <div class="channel-card" onclick="change('tvcultura', this)">
            <h4>TV Cultura</h4>
        </div>
    </div>

    <script>
        function change(id, el) {
            // Troca o canal no iframe de forma estável
            const player = document.getElementById('tv-player');
            player.src = `https://www.tdtchannels.com/embed/player.php?id=${id}`;

            // Atualiza UI
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            // Feedback visual e scroll mobile
            if(window.innerWidth < 800) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
