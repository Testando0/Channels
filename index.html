<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLVD | Live Streaming</title>
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #0070f3; /* Azul Vercel */
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container Principal */
        .dashboard {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        /* Stage do Player */
        .player-stage {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            overflow: hidden;
            border-radius: 16px;
            background: #000;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Sidebar de Canais */
        .channels-sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Custom Scrollbar */
        .channels-sidebar::-webkit-scrollbar { width: 4px; }
        .channels-sidebar::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        .channel-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .channel-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .channel-card.active {
            border-color: var(--accent-color);
            background: rgba(0, 112, 243, 0.1);
        }

        .channel-thumb {
            width: 50px;
            height: 50px;
            background: #1a1a1a;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            color: var(--accent-color);
        }

        .channel-info h4 { margin: 0; font-size: 0.95rem; }
        .channel-info p { margin: 5px 0 0; font-size: 0.75rem; color: var(--text-dim); }

        /* Responsividade Mobile */
        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .channels-sidebar { max-height: none; flex-direction: row; overflow-x: auto; padding-bottom: 10px; }
            .channel-card { min-width: 160px; flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <header style="width: 100%; max-width: 1200px; margin-bottom: 30px;">
        <h1 style="font-size: 1.5rem; letter-spacing: -1px;">TLVD <span style="color: var(--accent-color);">LIVE</span></h1>
    </header>

    <main class="dashboard">
        <section class="player-stage">
            <div class="iframe-wrapper">
                <iframe id="main-player" src="https://www.tdtchannels.com/embed/player.php?id=nick_pluto_br" allowfullscreen></iframe>
            </div>
            <div style="padding: 20px 5px 5px;">
                <h2 id="current-title" style="margin: 0; font-size: 1.2rem;">Nick Pluto TV</h2>
                <p id="current-status" style="color: var(--accent-color); font-size: 0.8rem; font-weight: bold; margin-top: 8px;">● TRANSMITINDO AO VIVO</p>
            </div>
        </section>

        <aside class="channels-sidebar">
            <div class="channel-card active" onclick="changeChannel('nick_pluto_br', 'Nick Pluto TV')">
                <div class="channel-thumb">NICK</div>
                <div class="channel-info">
                    <h4>Nick Pluto TV</h4>
                    <p>Infantil / Entretenimento</p>
                </div>
            </div>

            <div class="channel-card" onclick="changeChannel('record_news', 'Record News')">
                <div class="channel-thumb">RN</div>
                <div class="channel-info">
                    <h4>Record News</h4>
                    <p>Jornalismo 24h</p>
                </div>
            </div>

            <div class="channel-card" onclick="changeChannel('band', 'Rede Bandeirantes')">
                <div class="channel-thumb">BAND</div>
                <div class="channel-info">
                    <h4>Band</h4>
                    <p>Geral / Esportes</p>
                </div>
            </div>

            <div class="channel-card" onclick="changeChannel('cnn_br', 'CNN Brasil')">
                <div class="channel-thumb">CNN</div>
                <div class="channel-info">
                    <h4>CNN Brasil</h4>
                    <p>Notícias / Política</p>
                </div>
            </div>

            <div class="channel-card" onclick="changeChannel('rtp_1', 'RTP 1')">
                <div class="channel-thumb">RTP1</div>
                <div class="channel-info">
                    <h4>RTP 1</h4>
                    <p>Internacional (Portugal)</p>
                </div>
            </div>
        </aside>
    </main>

    <script>
        function changeChannel(id, name) {
            // Atualiza o Iframe
            const player = document.getElementById('main-player');
            player.src = `https://www.tdtchannels.com/embed/player.php?id=${id}`;
            
            // Atualiza Textos
            document.getElementById('current-title').innerText = name;

            // Atualiza Classe Ativa na Sidebar
            document.querySelectorAll('.channel-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Scroll suave para o topo no mobile ao trocar canal
            if(window.innerWidth < 900) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
