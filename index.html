<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLVD | Native Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg: #000;
            --accent: #0070f3;
            --surface: #0a0a0a;
            --border: rgba(255,255,255,0.1);
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Container do Player */
        .stage {
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
            background: var(--surface);
            border-radius: 24px;
            padding: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Grid de Canais */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 1000px;
            margin-top: 30px;
            padding: 0 10px 50px;
        }

        .channel-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .channel-item:hover {
            border-color: var(--accent);
            background: rgba(0, 112, 243, 0.05);
        }

        .channel-item.active {
            border-color: var(--accent);
            background: rgba(0, 112, 243, 0.1);
            color: var(--accent);
        }

        .channel-item h4 { margin: 0; font-size: 0.85rem; font-weight: 600; }

        header { padding: 30px 0; width: 100%; text-align: center; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 800; letter-spacing: -1px; font-size: 1.5rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">TLVD <span style="color: var(--accent);">NATIVE</span></div>
    </header>

    <div class="stage">
        <div class="video-box">
            <video id="video" controls autoplay playsinline></video>
        </div>
    </div>

    <div class="channel-grid">
        <div class="channel-item active" onclick="playChannel('https://service-stitcher.clusters.pluto.tv/stitch/v1/master/playlist.m3u8?channel_id=5f3303f56a593300076a5996&deviceType=web&deviceMake=chrome', this)">
            <h4>Nick Pluto TV</h4>
        </div>
        <div class="channel-item" onclick="playChannel('https://service-stitcher.clusters.pluto.tv/stitch/v1/master/playlist.m3u8?channel_id=5e69317500171a00075d9e5b&deviceType=web', this)">
            <h4>Cine Sucessos</h4>
        </div>
        <div class="channel-item" onclick="playChannel('https://stream.ads.ottera.tv/playlist.m3u8?network_id=2116', this)">
            <h4>Record News</h4>
        </div>
        <div class="channel-item" onclick="playChannel('https://player-tvcultura.stream.uol.com.br/live/tvcultura.m3u8', this)">
            <h4>TV Cultura</h4>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        let hls = new Hls();

        function playChannel(url, element) {
            // UI Update
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');

            // HLS Logic
            if (Hls.isSupported()) {
                hls.destroy(); // Limpa a instância anterior para não dar lag
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => video.play());
            }
        }

        // Inicia com o primeiro canal
        window.onload = () => {
            const firstChannel = document.querySelector('.channel-item');
            playChannel('https://service-stitcher.clusters.pluto.tv/stitch/v1/master/playlist.m3u8?channel_id=5f3303f56a593300076a5996&deviceType=web', firstChannel);
        };
    </script>
</body>
</html>
