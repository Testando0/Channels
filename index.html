<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLVD | Native Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #0070f3;
            --surface: #0a0a0a;
            --border: rgba(255,255,255,0.08);
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            width: 95%;
            max-width: 900px;
            margin-top: 30px;
        }

        /* Container do Player com efeito Glass */
        #player {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .channel-list {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            padding-bottom: 50px;
        }

        .btn-channel {
            background: var(--surface);
            border: 1px solid var(--border);
            color: #ccc;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
            text-align: center;
        }

        .btn-channel:hover {
            border-color: var(--accent);
            background: rgba(0, 112, 243, 0.05);
            color: #fff;
        }

        .btn-channel.active {
            border-color: var(--accent);
            background: rgba(0, 112, 243, 0.1);
            color: var(--accent);
            font-weight: bold;
        }

        header { padding: 40px 0; text-align: center; width: 100%; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 900; letter-spacing: -1.5px; font-size: 1.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">TLVD <span style="color: var(--accent);">STREAMS</span></div>
    </header>

    <div class="main-container">
        <div id="player"></div>

        <div class="channel-list">
            <div class="btn-channel active" onclick="changeChannel('https://player-tvcultura.stream.uol.com.br/live/tvcultura.m3u8', this)">TV Cultura</div>
            <div class="btn-channel" onclick="changeChannel('https://stream.ads.ottera.tv/playlist.m3u8?network_id=2116', this)">Record News</div>
            <div class="btn-channel" onclick="changeChannel('https://amg01209-amg01209c1-plutotv-brazil-1.chila.amagi.tv/playlist.m3u8', this)">Nick (Pluto)</div>
            <div class="btn-channel" onclick="changeChannel('https://linears-sbt-prd.edgio.net/linear/sbt/sbt-hd/sbt-hd.m3u8', this)">SBT HD</div>
        </div>
    </div>

    <script>
        // Inicialização do Player
        var player = new Clappr.Player({
            source: 'https://player-tvcultura.stream.uol.com.br/live/tvcultura.m3u8',
            parentId: '#player',
            width: '100%',
            height: '100%',
            autoPlay: true,
            preload: 'auto',
            playback: {
                playInline: true,
                hlsjsConfig: {
                    // Aqui forçamos a limpeza de cache e ignoramos erros leves de CORS
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false;
                    }
                }
            }
        });

        function changeChannel(url, el) {
            // UI
            document.querySelectorAll('.btn-channel').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            // Troca o Source no Clappr de forma nativa
            player.load(url);
            player.play();
        }
    </script>
</body>
</html>
