<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLVD | Studio Live</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --accent: #0070f3; /* Vercel Blue */
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ededed;
            --text-dim: #888;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header Estilo Dashboard */
        header {
            width: 100%;
            max-width: 1100px;
            padding: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .status-badge {
            font-size: 0.7rem;
            background: rgba(0, 255, 100, 0.1);
            color: #00ff64;
            padding: 4px 10px;
            border-radius: 100px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Main Container */
        .app-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
        }

        /* Player Stage */
        .player-view {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 14px;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .info-bar {
            padding: 15px 10px;
        }

        .info-bar h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text);
        }

        /* Sidebar de Canais (Glassmorphism) */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .card:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.06);
        }

        .card.active {
            border-color: var(--accent);
            background: rgba(0, 112, 243, 0.1);
        }

        .thumb {
            width: 45px;
            height: 45px;
            background: #111;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.7rem;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .card-data h4 { margin: 0; font-size: 0.9rem; font-weight: 500; }
        .card-data p { margin: 3px 0 0; font-size: 0.7rem; color: var(--text-dim); }

        /* Mobile Layout */
        @media (max-width: 850px) {
            .app-container { grid-template-columns: 1fr; }
            .sidebar {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            .card { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TLVD <span style="color: var(--accent);">STUDIO</span></div>
        <div class="status-badge">● Engine Online</div>
    </header>

    <main class="app-container">
        <section class="player-view">
            <div class="video-wrapper">
                <iframe id="main-frame" src="https://pluto.tv/live-tv/nick-pluto-tv-ptv1/embed" allowfullscreen allow="autoplay"></iframe>
            </div>
            <div class="info-bar">
                <h2 id="channel-name">Nick Pluto TV</h2>
            </div>
        </section>

        <aside class="sidebar">
            <div class="card active" onclick="change('https://pluto.tv/live-tv/nick-pluto-tv-ptv1/embed', 'Nick Pluto TV')">
                <div class="thumb">NICK</div>
                <div class="card-data"><h4>Nick Pluto TV</h4><p>Infantil</p></div>
            </div>

            <div class="card" onclick="change('https://pluto.tv/live-tv/pluto-tv-cine-sucessos-br/embed', 'Cine Sucessos')">
                <div class="thumb">CINE</div>
                <div class="card-data"><h4>Cine Sucessos</h4><p>Filmes</p></div>
            </div>

            <div class="card" onclick="change('https://www.youtube.com/embed/live_stream?channel=UCv998T_2Yy2D02V98fIe9aw', 'CNN Brasil')">
                <div class="thumb">CNN</div>
                <div class="card-data"><h4>CNN Brasil</h4><p>Notícias</p></div>
            </div>

            <div class="card" onclick="change('https://player.r7.com/video/i/5e3474324b4955315a000851', 'Record News')">
                <div class="thumb">RECORD</div>
                <div class="card-data"><h4>Record News</h4><p>Jornalismo</p></div>
            </div>

            <div class="card" onclick="change('https://tvcultura.com.br/aovivo/embed/', 'TV Cultura')">
                <div class="thumb">CULT</div>
                <div class="card-data"><h4>TV Cultura</h4><p>Educação</p></div>
            </div>
        </aside>
    </main>

    <script>
        function change(url, name) {
            const frame = document.getElementById('main-frame');
            const title = document.getElementById('channel-name');
            
            // Troca o SRC e o Título
            frame.src = url;
            title.innerText = name;

            // Highlight no card selecionado
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Scroll suave para o topo se estiver no mobile
            if(window.innerWidth < 850) {
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }
    </script>
</body>
</html>
